# Computer Community Network — production stack for a shared VPS.
#
# Designed to live next to other apps on the same server:
#   - its own compose project ("mcvc"), network and volume names
#   - nothing listens publicly: web and api bind to 127.0.0.1 only,
#     so your existing reverse proxy (nginx/Caddy) decides what is exposed
#   - ports are configurable in .env to avoid clashes
name: mcvc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - mcvc_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcvc"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [mcvc]

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    image: mcvc-api:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://mcvc:${APP_DB_PASSWORD}@db:5432/mcvc?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set in .env}
      COMMUNITY_HOSTS: ${COMMUNITY_HOST},www.${COMMUNITY_HOST}
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET}
      CORS_ORIGINS: https://${COMMUNITY_HOST}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-4100}:4000"
    networks: [mcvc]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        API_URL: http://api:4000
        COMMUNITY_HOSTS: ${COMMUNITY_HOST},www.${COMMUNITY_HOST},localhost,127.0.0.1
        NEXT_PUBLIC_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
    image: mcvc-web:latest
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:4000
      COMMUNITY_HOSTS: ${COMMUNITY_HOST},www.${COMMUNITY_HOST},localhost,127.0.0.1
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    networks: [mcvc]

volumes:
  mcvc_pgdata:

networks:
  mcvc:
    name: mcvc_net
