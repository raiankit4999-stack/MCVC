# nginx site for an EXISTING nginx on the VPS. Copy to /etc/nginx/sites-available/mcvc.conf,
# replace pccommunity.in with your domain, symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
# Only server_names listed here are routed to this app; your other sites are untouched.
#
# Everything goes to the web container — it serves the community site, admin, ERP,
# store websites (by Host header) and proxies /api/v1 to the API internally.

map $http_upgrade $mcvc_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name pccommunity.in www.pccommunity.in *.stores.pccommunity.in;
    # Certbot will add the 443 block: certbot --nginx -d pccommunity.in -d www.pccommunity.in
    # Wildcard (*.stores...) certificates need a DNS challenge: certbot certonly --manual --preferred-challenges dns -d '*.stores.pccommunity.in'

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcvc_connection_upgrade;
    }
}

# Store custom domains (e.g. abccomputers.in): add each verified domain to a server block like the
# one above, or use the Caddy config in deploy/Caddyfile, which issues certificates automatically
# for any domain the platform has verified (on-demand TLS).
